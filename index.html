<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Translate — Language Translation Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* === BASE === */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #1a73e8;
      --primary-hover: #1557b0;
      --primary-light: #e8f0fe;
      --surface: #ffffff;
      --surface-2: #f8f9fa;
      --border: #dadce0;
      --border-focus: #1a73e8;
      --text-primary: #202124;
      --text-secondary: #5f6368;
      --text-placeholder: #9aa0a6;
      --success: #1e8e3e;
      --error: #d93025;
      --shadow-1: 0 1px 3px rgba(0,0,0,0.12);
      --shadow-2: 0 4px 12px rgba(0,0,0,0.15);
      --shadow-3: 0 8px 24px rgba(0,0,0,0.12);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 24px;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      --header-h: 64px;
    }

    /* === DARK MODE === */
    [data-theme="dark"] {
      --primary: #8ab4f8;
      --primary-hover: #aecbfa;
      --primary-light: #394457;
      --surface: #202124;
      --surface-2: #303134;
      --border: #3c4043;
      --border-focus: #8ab4f8;
      --text-primary: #e8eaed;
      --text-secondary: #9aa0a6;
      --text-placeholder: #9aa0a6;
      --shadow-1: 0 1px 3px rgba(0,0,0,0.4);
      --shadow-2: 0 4px 12px rgba(0,0,0,0.5);
    }

    html {
      -webkit-font-smoothing: antialiased;
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      color: var(--text-primary);
      background: var(--surface-2);
      min-height: 100vh;
      transition: background 0.3s ease, color 0.3s ease;
    }

    ::selection {
      background: var(--primary-light);
      color: var(--text-primary);
    }

    /* === HEADER === */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 100;
      transition: box-shadow 0.2s ease, background 0.3s ease;
    }

    .header--scrolled {
      box-shadow: var(--shadow-2);
    }

    .header__brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header__logo {
      width: 36px;
      height: 36px;
      background: var(--primary-light);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
    }

    .header__logo svg {
      width: 20px;
      height: 20px;
    }

    .header__title {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 0.3px;
    }

    .header__actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header__auth-btn {
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: transparent;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      color: var(--primary);
      cursor: pointer;
      transition: var(--transition);
    }

    .header__auth-btn:hover {
      background: var(--primary-light);
      border-color: var(--primary);
    }

    .header__auth-btn--primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .header__auth-btn--primary:hover {
      background: var(--primary-hover);
    }

    .header__user {
      display: none;
      align-items: center;
      gap: 8px;
      position: relative;
    }

    .header__user--visible { display: flex; }

    .header__avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
      transition: var(--transition);
    }

    .header__avatar:hover { opacity: 0.9; }

    .header__user-menu {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      min-width: 200px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-3);
      overflow: hidden;
      z-index: 110;
    }

    .header__user-menu--open { display: block; }

    .header__user-email {
      padding: 12px 16px;
      font-size: 13px;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border);
      word-break: break-all;
    }

    .header__user-item {
      width: 100%;
      padding: 12px 16px;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 14px;
      text-align: left;
      color: var(--text-primary);
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .header__user-item:hover { background: var(--surface-2); }

    .header__user-item--danger { color: var(--error); }

    .header__guest { display: flex; gap: 8px; }
    .header__guest--hidden { display: none; }

    .header__theme-btn {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .header__theme-btn:hover {
      background: var(--surface-2);
    }

    .header__theme-btn .icon-moon { display: none; }
    [data-theme="dark"] .header__theme-btn .icon-sun { display: none; }
    [data-theme="dark"] .header__theme-btn .icon-moon { display: block; }

    /* === FILE WARNING === */
    .file-warning {
      position: fixed;
      top: var(--header-h);
      left: 0;
      right: 0;
      z-index: 99;
      padding: 10px 16px;
      background: #FEF7E0;
      color: #7C4A00;
      border-bottom: 1px solid #F9AB00;
      font-size: 13px;
      line-height: 1.5;
    }

    .file-warning code {
      display: block;
      margin-top: 6px;
      padding: 6px 10px;
      background: rgba(0,0,0,0.06);
      border-radius: var(--radius-sm);
      font-size: 12px;
      word-break: break-all;
    }

    .file-warning a { color: var(--primary); font-weight: 600; }

    /* === MAIN === */
    .main {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px 48px;
      margin-top: calc(var(--header-h) + 24px);
    }

    .main--with-warning {
      margin-top: calc(var(--header-h) + 72px);
    }

    /* === LANGUAGE BAR === */
    .lang-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md) var(--radius-md) 0 0;
      padding: 8px 12px;
      position: relative;
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .lang-bar__side {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 2px;
      min-width: 0;
      position: relative;
    }

    .lang-bar__side--target {
      justify-content: flex-end;
    }

    .lang-bar__tabs {
      display: flex;
      align-items: center;
      gap: 2px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .lang-bar__tabs::-webkit-scrollbar { display: none; }

    .lang-tab {
      position: relative;
      padding: 8px 12px;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.3px;
      color: var(--text-secondary);
      cursor: pointer;
      white-space: nowrap;
      border-radius: var(--radius-sm);
      transition: color 0.2s ease, background 0.15s ease;
    }

    .lang-tab:hover {
      background: var(--surface-2);
      color: var(--text-primary);
    }

    .lang-tab--active {
      color: var(--primary);
    }

    .lang-tab__underline {
      position: absolute;
      bottom: 0;
      left: 12px;
      right: 12px;
      height: 2px;
      background: var(--primary);
      border-radius: 2px;
      transform: scaleX(0);
      transition: transform 0.2s ease;
    }

    .lang-tab--active .lang-tab__underline {
      transform: scaleX(1);
    }

    .lang-bar__more {
      padding: 8px 10px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      gap: 2px;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.15s ease;
    }

    .lang-bar__more:hover { background: var(--surface-2); }

    .lang-bar__swap {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .lang-bar__swap:hover {
      background: var(--primary-light);
      color: var(--primary);
    }

    .lang-bar__swap-icon {
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .lang-bar__swap--rotated .lang-bar__swap-icon {
      transform: rotate(180deg);
    }

    /* Language dropdown */
    .lang-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      margin-top: 4px;
      width: 220px;
      max-height: 280px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-3);
      z-index: 50;
      overflow: hidden;
      flex-direction: column;
    }

    .lang-dropdown--open { display: flex; }

    .lang-bar__side--target .lang-dropdown {
      left: auto;
      right: 0;
    }

    .lang-dropdown__search {
      padding: 10px 12px;
      border: none;
      border-bottom: 1px solid var(--border);
      font-family: inherit;
      font-size: 14px;
      background: var(--surface);
      color: var(--text-primary);
      outline: none;
    }

    .lang-dropdown__search:focus {
      box-shadow: inset 0 -2px 0 var(--primary);
    }

    .lang-dropdown__list {
      overflow-y: auto;
      list-style: none;
    }

    .lang-dropdown__item {
      padding: 10px 14px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s ease;
      color: var(--text-primary);
    }

    .lang-dropdown__item:hover,
    .lang-dropdown__item--active {
      background: var(--primary-light);
      color: var(--primary);
    }

    /* Hidden selects for API */
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      border: 0;
    }

    /* === PANELS === */
    .panels {
      display: flex;
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 var(--radius-md) var(--radius-md);
      overflow: hidden;
      background: var(--surface);
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .panel {
      flex: 1;
      width: 50%;
      display: flex;
      flex-direction: column;
      min-width: 0;
      position: relative;
      transition: box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .panel--source {
      border-right: 1px solid var(--border);
    }

    .panel--focused {
      box-shadow: inset 0 0 0 2px rgba(26, 115, 232, 0.2);
      z-index: 1;
    }

    [data-theme="dark"] .panel--focused {
      box-shadow: inset 0 0 0 2px rgba(138, 180, 248, 0.25);
    }

    .panel--target {
      background: var(--surface-2);
    }

    /* Panel error banner */
    .panel__error {
      display: none;
      padding: 10px 16px;
      background: var(--error);
      color: #fff;
      font-size: 13px;
      animation: slideDown 0.25s ease-out;
    }

    .panel__error--visible {
      display: block;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .panel__body {
      flex: 1;
      position: relative;
      min-height: 200px;
    }

    .panel__textarea,
    .panel__output {
      width: 100%;
      min-height: 200px;
      padding: 20px;
      border: none;
      outline: none;
      resize: none;
      font-family: inherit;
      font-size: 18px;
      line-height: 1.6;
      color: var(--text-primary);
      background: transparent;
    }

    .panel__textarea::placeholder {
      color: var(--text-placeholder);
    }

    .panel__output {
      pointer-events: none;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .panel__output--animate {
      animation: fadeSlideUp 0.25s ease-out;
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Loading skeleton */
    .panel__skeleton {
      display: none;
      position: absolute;
      inset: 20px;
      flex-direction: column;
      gap: 12px;
    }

    .panel__skeleton--visible { display: flex; }

    .skeleton-line {
      height: 16px;
      background: var(--border);
      border-radius: 4px;
      animation: skeletonPulse 1.2s ease-in-out infinite;
    }

    .skeleton-line:nth-child(1) { width: 90%; }
    .skeleton-line:nth-child(2) { width: 75%; animation-delay: 0.15s; }
    .skeleton-line:nth-child(3) { width: 60%; animation-delay: 0.3s; }

    @keyframes skeletonPulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    /* === PANEL TOOLBAR === */
    .panel__toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 48px;
      padding: 0 16px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .panel__counter {
      font-size: 12px;
      font-weight: 300;
      color: var(--text-secondary);
      letter-spacing: 0.3px;
    }

    .panel__counter--warn { color: #E37400; }
    .panel__counter--limit { color: var(--error); font-weight: 500; }

    .panel__tools {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* === BUTTONS === */
    .icon-btn {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, color 0.15s ease;
      position: relative;
    }

    .icon-btn:hover {
      background: var(--surface-2);
      color: var(--text-primary);
    }

    .icon-btn--success {
      color: var(--success) !important;
    }

    .icon-btn[data-tooltip]::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      padding: 4px 8px;
      background: var(--text-primary);
      color: var(--surface);
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
      border-radius: 4px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }

    .icon-btn:hover[data-tooltip]::after { opacity: 1; }

    /* === TRANSLATE BUTTON === */
    .translate-wrap {
      display: flex;
      justify-content: center;
      margin-top: 24px;
    }

    .translate-btn {
      position: relative;
      overflow: hidden;
      min-width: 200px;
      max-width: 200px;
      width: 100%;
      height: 48px;
      border: none;
      border-radius: var(--radius-lg);
      background: var(--primary);
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: var(--transition);
      box-shadow: var(--shadow-1);
    }

    .translate-btn:hover:not(:disabled) {
      background: var(--primary-hover);
      box-shadow: var(--shadow-2);
    }

    .translate-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .translate-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .translate-btn--success {
      background: var(--success) !important;
    }

    .translate-btn__spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    .translate-btn--loading .translate-btn__label { display: none; }
    .translate-btn--loading .translate-btn__spinner { display: block; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .translate-btn__ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
      transform: scale(0);
      animation: ripple 0.4s ease-out;
      pointer-events: none;
    }

    @keyframes ripple {
      to { transform: scale(4); opacity: 0; }
    }

    /* === AUTH MODAL === */
    .auth-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .auth-overlay--open {
      display: flex;
      animation: fadeIn 0.2s ease;
    }

    .auth-modal {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-3);
      overflow: hidden;
      animation: fadeSlideUp 0.25s ease-out;
    }

    .auth-modal__header {
      display: flex;
      border-bottom: 1px solid var(--border);
    }

    .auth-modal__tab {
      flex: 1;
      padding: 14px;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      position: relative;
      transition: color 0.2s ease;
    }

    .auth-modal__tab--active {
      color: var(--primary);
    }

    .auth-modal__tab--active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--primary);
    }

    .auth-modal__close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 32px;
      height: 32px;
      border: none;
      background: var(--surface-2);
      border-radius: 50%;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-modal__body {
      padding: 24px;
      position: relative;
    }

    .auth-form { display: none; flex-direction: column; gap: 16px; }
    .auth-form--active { display: flex; }

    .auth-form__group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.3px;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .auth-form__group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 16px;
      background: var(--surface);
      color: var(--text-primary);
      transition: var(--transition);
    }

    .auth-form__group input:focus {
      outline: none;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.2);
    }

    .auth-form__password-wrap {
      position: relative;
    }

    .auth-form__toggle-pw {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 12px;
    }

    .auth-form__error {
      font-size: 13px;
      color: var(--error);
      display: none;
    }

    .auth-form__error--visible { display: block; }

    .auth-form__submit {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: var(--radius-lg);
      background: var(--primary);
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
    }

    .auth-form__submit:hover { background: var(--primary-hover); }

    .auth-form__guest {
      text-align: center;
      font-size: 14px;
      color: var(--text-secondary);
    }

    .auth-form__guest button {
      border: none;
      background: none;
      color: var(--primary);
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
    }

    .auth-form__guest button:hover { text-decoration: underline; }

    /* === EXTRAS BAR === */
    .extras-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .extras-bar__welcome {
      font-size: 14px;
      color: var(--text-secondary);
      letter-spacing: 0.3px;
    }

    .extras-bar__welcome strong { color: var(--text-primary); }

    .extras-bar__actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .extras-btn {
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition);
    }

    .extras-btn:hover {
      background: var(--surface-2);
      color: var(--primary);
      border-color: var(--primary);
    }

    .extras-btn--active {
      background: var(--primary-light);
      color: var(--primary);
      border-color: var(--primary);
    }

    /* === HISTORY PANEL === */
    .history-panel {
      display: none;
      margin-bottom: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      max-height: 220px;
      overflow: hidden;
      flex-direction: column;
    }

    .history-panel--open { display: flex; }

    .history-panel__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      font-weight: 600;
    }

    .history-panel__clear {
      border: none;
      background: none;
      color: var(--primary);
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
    }

    .history-panel__list {
      overflow-y: auto;
      list-style: none;
      flex: 1;
    }

    .history-panel__empty {
      padding: 24px;
      text-align: center;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .history-item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .history-item:hover { background: var(--surface-2); }

    .history-item__meta {
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .history-item__text {
      font-size: 13px;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-item__arrow {
      color: var(--primary);
      margin: 0 4px;
    }

    /* === SCROLLBAR === */
    textarea::-webkit-scrollbar,
    .lang-dropdown__list::-webkit-scrollbar {
      width: 6px;
    }

    textarea::-webkit-scrollbar-thumb,
    .lang-dropdown__list::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 3px;
    }

    textarea { scrollbar-width: thin; scrollbar-color: var(--primary) transparent; }

    /* === RESPONSIVE === */
    @media (max-width: 768px) {
      .main { padding: 16px 12px 40px; }
      .header { padding: 0 16px; }
      .header__title { font-size: 20px; }
    }

    @media (max-width: 600px) {
      .panels { flex-direction: column; }
      .panel { width: 100%; }
      .panel--source { border-right: none; border-bottom: 1px solid var(--border); }
      .lang-bar { flex-wrap: wrap; }
      .lang-bar__swap .lang-bar__swap-icon--mobile { display: block; }
      .lang-bar__swap .lang-bar__swap-icon--desktop { display: none; }

      .lang-bar__swap .lang-bar__swap-icon--mobile { display: none; }

    let copyRevertTimeout = null;
    let currentUser = null;

    /* ===== AUTH SYSTEM (localStorage demo) ===== */
    function hashPassword(pw) {
      let h = 0;
      for (let i = 0; i < pw.length; i++) h = ((h << 5) - h) + pw.charCodeAt(i) | 0;
      return 'h' + Math.abs(h).toString(36);
    }

    function getUsers() {
      try { return JSON.parse(localStorage.getItem(USERS_KEY)) || []; }
      catch { return []; }
    }

    function saveUsers(users) {
      localStorage.setItem(USERS_KEY, JSON.stringify(users));
    }

    function getSession() {
      try { return JSON.parse(localStorage.getItem(SESSION_KEY)); }
      catch { return null; }
    }

    function setSession(user) {
      if (user) localStorage.setItem(SESSION_KEY, JSON.stringify({ email: user.email, name: user.name }));
      else localStorage.removeItem(SESSION_KEY);
    }

    function openAuthModal(tab = 'login') {
      authOverlay.classList.add('auth-overlay--open');
      switchAuthTab(tab);
      document.getElementById(tab === 'signup' ? 'signupEmail' : 'loginEmail')?.focus();
    }

    function closeAuthModal() {
      authOverlay.classList.remove('auth-overlay--open');
      document.getElementById('loginError').classList.remove('auth-form__error--visible');
      document.getElementById('signupError').classList.remove('auth-form__error--visible');
    }

    function switchAuthTab(tab) {
      document.querySelectorAll('.auth-modal__tab').forEach(t => {
        t.classList.toggle('auth-modal__tab--active', t.dataset.tab === tab);
      });
      loginForm.classList.toggle('auth-form--active', tab === 'login');
      signupForm.classList.toggle('auth-form--active', tab === 'signup');
    }

    function updateAuthUI() {
      const session = getSession();
      currentUser = session ? getUsers().find(u => u.email === session.email) : null;

      if (currentUser) {
        authGuest.classList.add('header__guest--hidden');
        authUser.classList.add('header__user--visible');
        const initial = (currentUser.name || currentUser.email)[0].toUpperCase();
        userAvatarBtn.textContent = initial;
        userEmailDisplay.textContent = currentUser.email;
        welcomeText.innerHTML = `Welcome back, <strong>${escapeHtml(currentUser.name || currentUser.email.split('@')[0])}</strong>`;
        historyToggleBtn.hidden = false;
        savePrefsBtn.hidden = false;
        exportHistoryBtn.hidden = false;
        loadUserPreferences();
      } else {
        authGuest.classList.remove('header__guest--hidden');
        authUser.classList.remove('header__user--visible');
        welcomeText.textContent = 'Translate between 19+ languages instantly';
        historyToggleBtn.hidden = true;
        savePrefsBtn.hidden = true;
        exportHistoryBtn.hidden = true;
        historyPanel.classList.remove('history-panel--open');
      }
    }

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    function handleSignup(e) {
      e.preventDefault();
      const name = document.getElementById('signupName').value.trim();
      const email = document.getElementById('signupEmail').value.trim().toLowerCase();
      const password = document.getElementById('signupPassword').value;
      const errEl = document.getElementById('signupError');

      if (password.length < 6) {
        errEl.textContent = 'Password must be at least 6 characters.';
        errEl.classList.add('auth-form__error--visible');
        return;
      }

      const users = getUsers();
      if (users.some(u => u.email === email)) {
        errEl.textContent = 'An account with this email already exists.';
        errEl.classList.add('auth-form__error--visible');
        return;
      }

      users.push({ name, email, password: hashPassword(password), createdAt: Date.now() });
      saveUsers(users);
      setSession({ email, name });
      signupForm.reset();
      closeAuthModal();
      updateAuthUI();
      showPanelError('Account created successfully!');
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim().toLowerCase();
      const password = document.getElementById('loginPassword').value;
      const errEl = document.getElementById('loginError');

      const user = getUsers().find(u => u.email === email);
      if (!user || user.password !== hashPassword(password)) {
        errEl.textContent = 'Invalid email or password.';
        errEl.classList.add('auth-form__error--visible');
        return;
      }

      setSession(user);
      loginForm.reset();
      closeAuthModal();
      updateAuthUI();
      showPanelError('Signed in successfully!');
    }

    function logout() {
      setSession(null);
      userMenu.classList.remove('header__user-menu--open');
      updateAuthUI();
      showPanelError('Signed out.');
    }

    /* ===== Translation history ===== */
    function getHistoryKey() {
      return currentUser ? `${HISTORY_KEY}_${currentUser.email}` : null;
    }

    function getHistory() {
      const key = getHistoryKey();
      if (!key) return [];
      try { return JSON.parse(localStorage.getItem(key)) || []; }
      catch { return []; }
    }

    function saveToHistory(source, target, original, translated) {
      if (!currentUser) return;
      const key = getHistoryKey();
      let history = getHistory();
      history.unshift({
        id: Date.now(),
        source, target, original, translated,
        date: new Date().toLocaleString()
      });
      history = history.slice(0, 50);
      localStorage.setItem(key, JSON.stringify(history));
      renderHistory();
    }

    function renderHistory() {
      const history = getHistory();
      if (!history.length) {
        historyList.innerHTML = '<li class="history-panel__empty">No translations yet. Translate something to see history here.</li>';
        return;
      }
      historyList.innerHTML = history.map(h => `
        <li class="history-item" data-id="${h.id}">
          <div class="history-item__meta">${escapeHtml(getLangName(h.source))} <span class="history-item__arrow">→</span> ${escapeHtml(getLangName(h.target))} · ${escapeHtml(h.date)}</div>
          <div class="history-item__text">${escapeHtml(h.original)} → ${escapeHtml(h.translated)}</div>
        </li>
      `).join('');

      historyList.querySelectorAll('.history-item').forEach(item => {
        item.addEventListener('click', () => {
          const h = history.find(x => x.id === Number(item.dataset.id));
          if (!h) return;
          sourceLang.value = h.source;
          targetLang.value = h.target;
          sourceText.value = h.original;
          setTargetText(h.translated);
          updateTabStates();
          updateCharCounter();
          historyPanel.classList.remove('history-panel--open');
        });
      });
    }

    function clearHistory() {
      const key = getHistoryKey();
      if (key) localStorage.removeItem(key);
      renderHistory();
    }

    function exportHistory() {
      if (!currentUser) { openAuthModal('login'); return; }
      const history = getHistory();
      if (!history.length) {
        showPanelError('No history to export.');
        return;
      }
      const blob = new Blob([JSON.stringify(history, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `translations-${Date.now()}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
      showPanelError('History exported!');
    }

    async function shareTranslation() {
      const text = targetText.value.trim();
      if (!text) {
        showPanelError('Nothing to share. Translate first.');
        return;
      }
      const shareData = {
        title: 'Translation',
        text: `${sourceText.value.trim()}\n\n→ ${text}`
      };
      if (navigator.share) {
        try { await navigator.share(shareData); } catch { /* cancelled */ }
      } else {
        await copyToClipboard();
        showPanelError('Copied — paste to share anywhere.');
      }
    }

    /* ===== Saved preferences ===== */
    function getPrefsKey() {
      return currentUser ? `${PREFS_KEY}_${currentUser.email}` : null;
    }

    function loadUserPreferences() {
      const key = getPrefsKey();
      if (!key) return;
      try {
        const prefs = JSON.parse(localStorage.getItem(key));
        if (prefs?.source) { sourceLang.value = prefs.source; }
        if (prefs?.target) { targetLang.value = prefs.target; }
        updateTabStates();
      } catch { /* ignore */ }
    }

    function saveUserPreferences() {
      if (!currentUser) {
        openAuthModal('login');
        return;
      }
      const key = getPrefsKey();
      localStorage.setItem(key, JSON.stringify({
        source: sourceLang.value,
        target: targetLang.value
      }));
      showPanelError('Language pair saved!');
      savePrefsBtn.classList.add('extras-btn--active');
      setTimeout(() => savePrefsBtn.classList.remove('extras-btn--active'), 1500);
    }

    /* ===== Theme ===== */
    function initTheme() {
      const saved = localStorage.getItem('theme');
      if (saved) document.documentElement.setAttribute('data-theme', saved);
    }

    themeBtn.addEventListener('click', () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });

    /* ===== Header scroll shadow ===== */
    window.addEventListener('scroll', () => {
      header.classList.toggle('header--scrolled', window.scrollY > 10);
    }, { passive: true });

    /* ===== File protocol warning ===== */
    if (window.location.protocol === 'file:') {
      const warn = document.getElementById('fileProtocolWarning');
      warn.hidden = false;
      mainEl.classList.add('main--with-warning');
    }

    /* ===== Language UI ===== */
    function getLangName(code) {
      return LANGUAGES.find(l => l.code === code)?.name || code;
    }

    function createTab(code, name, side) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'lang-tab';
      btn.dataset.code = code;
      btn.dataset.side = side;
      btn.innerHTML = `${name}<span class="lang-tab__underline"></span>`;
      btn.addEventListener('click', () => setLanguage(side, code));
      return btn;
    }

    function renderTabs() {
      sourceTabsEl.innerHTML = '';
      targetTabsEl.innerHTML = '';
      POPULAR_SOURCE.forEach(code => {
        const lang = LANGUAGES.find(l => l.code === code);
        if (lang) sourceTabsEl.appendChild(createTab(code, lang.name === 'Detect language' ? 'Detect' : lang.name, 'source'));
      });
      POPULAR_TARGET.forEach(code => {
        const lang = LANGUAGES.find(l => l.code === code);
        if (lang) targetTabsEl.appendChild(createTab(code, lang.name, 'target'));
      });
      updateTabStates();
    }

    function renderDropdownLists() {
      const sourceLangs = LANGUAGES.filter(l => !POPULAR_SOURCE.includes(l.code));
      const targetLangs = LANGUAGES.filter(l => !l.sourceOnly && !POPULAR_TARGET.includes(l.code));

      sourceDropdownList.innerHTML = sourceLangs.map(l =>
        `<li class="lang-dropdown__item" data-code="${l.code}" data-side="source">${l.name}</li>`
      ).join('');

      targetDropdownList.innerHTML = targetLangs.map(l =>
        `<li class="lang-dropdown__item" data-code="${l.code}" data-side="target">${l.name}</li>`
      ).join('');

      document.querySelectorAll('.lang-dropdown__item').forEach(item => {
        item.addEventListener('click', () => {
          setLanguage(item.dataset.side, item.dataset.code);
          closeAllDropdowns();
        });
      });
    }

    function updateTabStates() {
      document.querySelectorAll('.lang-tab').forEach(tab => {
        const select = tab.dataset.side === 'source' ? sourceLang : targetLang;
        tab.classList.toggle('lang-tab--active', tab.dataset.code === select.value);
      });
      document.querySelectorAll('.lang-dropdown__item').forEach(item => {
        const select = item.dataset.side === 'source' ? sourceLang : targetLang;
        item.classList.toggle('lang-dropdown__item--active', item.dataset.code === select.value);
      });
    }

    function setLanguage(side, code) {
      const select = side === 'source' ? sourceLang : targetLang;
      select.value = code;
      updateTabStates();
      closeAllDropdowns();
    }

    function closeAllDropdowns() {
      sourceDropdown.classList.remove('lang-dropdown--open');
      targetDropdown.classList.remove('lang-dropdown--open');
      sourceMoreBtn.setAttribute('aria-expanded', 'false');
      targetMoreBtn.setAttribute('aria-expanded', 'false');
    }

    sourceMoreBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const open = sourceDropdown.classList.toggle('lang-dropdown--open');
      targetDropdown.classList.remove('lang-dropdown--open');
      sourceMoreBtn.setAttribute('aria-expanded', open);
      if (open) sourceDropdown.querySelector('.lang-dropdown__search').focus();
    });

    targetMoreBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const open = targetDropdown.classList.toggle('lang-dropdown--open');
      sourceDropdown.classList.remove('lang-dropdown--open');
      targetMoreBtn.setAttribute('aria-expanded', open);
      if (open) targetDropdown.querySelector('.lang-dropdown__search').focus();
    });

    document.addEventListener('click', closeAllDropdowns);

    /* Dropdown search filter */
    function setupDropdownSearch(dropdown) {
      const input = dropdown.querySelector('.lang-dropdown__search');
      const list = dropdown.querySelector('.lang-dropdown__list');
      input.addEventListener('input', () => {
        const q = input.value.toLowerCase();
        list.querySelectorAll('.lang-dropdown__item').forEach(item => {
          item.style.display = item.textContent.toLowerCase().includes(q) ? '' : 'none';
        });
      });
      input.addEventListener('click', e => e.stopPropagation());
    }
    setupDropdownSearch(sourceDropdown);
    setupDropdownSearch(targetDropdown);

    /* ===== Panel focus glow ===== */
    sourceText.addEventListener('focus', () => sourcePanel.classList.add('panel--focused'));
    sourceText.addEventListener('blur', () => sourcePanel.classList.remove('panel--focused'));

    /* ===== Character counter ===== */
    function updateCharCounter() {
      const len = sourceText.value.length;
      charCounter.textContent = `${len} / ${MAX_CHARS}`;
      charCounter.classList.toggle('panel__counter--warn', len >= MAX_CHARS * 0.9 && len < MAX_CHARS);
      charCounter.classList.toggle('panel__counter--limit', len >= MAX_CHARS);
    }

    /* ===== Error in source panel ===== */
    function showPanelError(text) {
      clearTimeout(errorTimeout);
      sourceError.textContent = text;
      sourceError.classList.add('panel__error--visible');
      errorTimeout = setTimeout(() => {
        sourceError.classList.remove('panel__error--visible');
      }, 4000);
    }

    /* ===== Trim API limit ===== */
    function trimToApiLimit(text) {
      const bytes = new TextEncoder().encode(text);
      if (bytes.length <= MAX_API_BYTES) return { text, truncated: false };
      return { text: new TextDecoder().decode(bytes.slice(0, MAX_API_BYTES)), truncated: true };
    }

    /* ===== Set target output with animation ===== */
    function setTargetText(text) {
      targetText.value = text;
      targetOutput.textContent = text;
      targetOutput.classList.remove('panel__output--animate');
      void targetOutput.offsetWidth;
      if (text) targetOutput.classList.add('panel__output--animate');
    }

    /* ===== Loading ===== */
    function setLoading(on) {
      translateBtn.disabled = on;
      swapBtn.disabled = on;
      translateBtn.classList.toggle('translate-btn--loading', on);
      translateBtn.querySelector('.translate-btn__label').textContent = on ? 'Translating...' : 'Translate';
      targetSkeleton.classList.toggle('panel__skeleton--visible', on);
      if (on) {
        setTargetText('');
        targetOutput.style.visibility = 'hidden';
      } else {
        targetOutput.style.visibility = '';
      }
    }

    /* ===== Ripple effect ===== */
    translateBtn.addEventListener('click', function ripple(e) {
      const rect = this.getBoundingClientRect();
      const span = document.createElement('span');
      span.className = 'translate-btn__ripple';
      const size = Math.max(rect.width, rect.height);
      span.style.width = span.style.height = size + 'px';
      span.style.left = (e.clientX - rect.left - size / 2) + 'px';
      span.style.top = (e.clientY - rect.top - size / 2) + 'px';
      this.appendChild(span);
      setTimeout(() => span.remove(), 400);
    });

    /* ===== Translate ===== */
    async function translateText() {
      const rawText = sourceText.value.trim();
      if (!rawText) {
        showPanelError('Please enter some text to translate.');
        return;
      }
      if (window.location.protocol === 'file:') {
        showPanelError('Use a local server (see yellow banner) for translation to work.');
        return;
      }

      const source = sourceLang.value;
      const target = targetLang.value;
      if (source !== 'auto' && source === target) {
        showPanelError('Source and target must be different.');
        return;
      }

      const { text, truncated } = trimToApiLimit(rawText);
      const url = `${API_BASE}?q=${encodeURIComponent(text)}&langpair=${source}|${target}`;

      setLoading(true);
      sourceError.classList.remove('panel__error--visible');

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Server error ${response.status}`);
        const data = await response.json();

        if (data.responseStatus && data.responseStatus !== 200) {
          throw new Error(data.responseDetails || 'Translation failed.');
        }
        if (data.quotaFinished) {
          showPanelError('Daily quota reached. Try again later.');
          return;
        }

        const translated = data.responseData?.translatedText;
        if (!translated) throw new Error('No translation returned.');

        setTargetText(translated);
        translateBtn.classList.add('translate-btn--success');
        setTimeout(() => translateBtn.classList.remove('translate-btn--success'), 400);

        saveToHistory(source, target, rawText, translated);

        if (truncated) showPanelError('Only first 500 bytes translated (API limit).');
      } catch (err) {
        console.error(err);
        showPanelError(
          err.message === 'Failed to fetch'
            ? 'Network error. Check connection or use local server.'
            : err.message
        );
      } finally {
        setLoading(false);
      }
    }

    /* ===== Swap ===== */
    function swapLanguages() {
      if (sourceLang.value === 'auto') {
        showPanelError('Select a specific source language before swapping.');
        return;
      }
      swapBtn.classList.add('lang-bar__swap--rotated');
      setTimeout(() => swapBtn.classList.remove('lang-bar__swap--rotated'), 300);

      const s = sourceLang.value;
      const t = targetLang.value;
      sourceLang.value = t;
      targetLang.value = s;

      const st = sourceText.value;
      const tt = targetText.value;
      sourceText.value = tt;
      setTargetText(st);
      updateCharCounter();
      updateTabStates();
    }

    /* ===== Copy with checkmark ===== */
    async function copyToClipboard() {
      const text = targetText.value.trim();
      if (!text) {
        showPanelError('Nothing to copy.');
        return;
      }
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        targetText.value = text;
        targetText.classList.remove('visually-hidden');
        targetText.select();
        document.execCommand('copy');
        targetText.classList.add('visually-hidden');
      }
      copyIcon.style.display = 'none';
      checkIcon.style.display = 'block';
      copyBtn.classList.add('icon-btn--success');
      clearTimeout(copyRevertTimeout);
      copyRevertTimeout = setTimeout(() => {
        copyIcon.style.display = 'block';
        checkIcon.style.display = 'none';
        copyBtn.classList.remove('icon-btn--success');
      }, 2000);
    }

    /* ===== Text-to-speech ===== */
    function speakTranslation() {
      const text = targetText.value.trim();
      if (!text) {
        showPanelError('Nothing to speak.');
        return;
      }
      if (!('speechSynthesis' in window)) {
        showPanelError('Text-to-speech not supported.');
        return;
      }
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = speechLocales[targetLang.value] || targetLang.value;
      u.rate = 0.95;
      window.speechSynthesis.speak(u);
    }

    /* ===== Voice input (mic) ===== */
    function startVoiceInput() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        showPanelError('Voice input not supported in this browser.');
        return;
      }
      const rec = new SR();
      rec.lang = speechLocales[sourceLang.value] || (sourceLang.value === 'auto' ? 'en-US' : sourceLang.value);
      rec.interimResults = false;
      rec.onresult = (e) => {
        sourceText.value = e.results[0][0].transcript;
        updateCharCounter();
      };
      rec.onerror = () => showPanelError('Could not capture voice.');
      rec.start();
    }

    /* ===== Clear ===== */
    function clearAll() {
      sourceText.value = '';
      setTargetText('');
      sourceLang.value = 'auto';
      targetLang.value = 'en';
      updateCharCounter();
      updateTabStates();
      sourceError.classList.remove('panel__error--visible');
      window.speechSynthesis?.cancel();
    }

    /* ===== Events ===== */
    sourceText.addEventListener('input', updateCharCounter);
    clearBtn.addEventListener('click', clearAll);
    swapBtn.addEventListener('click', swapLanguages);
    translateBtn.addEventListener('click', translateText);
    copyBtn.addEventListener('click', copyToClipboard);
    speakBtn.addEventListener('click', speakTranslation);
    micBtn.addEventListener('click', startVoiceInput);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeAuthModal();
      if (e.ctrlKey && e.key === 'Enter') {
        e.preventDefault();
        translateText();
      }
    });

    /* ===== Auth events ===== */
    loginBtn.addEventListener('click', () => openAuthModal('login'));
    signupBtn.addEventListener('click', () => openAuthModal('signup'));
    document.getElementById('authClose').addEventListener('click', closeAuthModal);
    authOverlay.addEventListener('click', (e) => { if (e.target === authOverlay) closeAuthModal(); });
    document.querySelectorAll('.auth-modal__tab').forEach(tab => {
      tab.addEventListener('click', () => switchAuthTab(tab.dataset.tab));
    });
    document.getElementById('switchToSignup').addEventListener('click', () => switchAuthTab('signup'));
    document.getElementById('switchToLogin').addEventListener('click', () => switchAuthTab('login'));
    document.getElementById('continueGuest').addEventListener('click', closeAuthModal);
    document.getElementById('forgotPwBtn').addEventListener('click', () => {
      showPanelError('Demo app: reset password by creating a new account with a new email.');
      closeAuthModal();
    });
    loginForm.addEventListener('submit', handleLogin);
    signupForm.addEventListener('submit', handleSignup);
    logoutBtn.addEventListener('click', logout);

    document.querySelectorAll('.auth-form__toggle-pw').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.target);
        const isPw = input.type === 'password';
        input.type = isPw ? 'text' : 'password';
        btn.textContent = isPw ? 'Hide' : 'Show';
      });
    });

    userAvatarBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      userMenu.classList.toggle('header__user-menu--open');
    });
    document.addEventListener('click', () => userMenu.classList.remove('header__user-menu--open'));

    document.getElementById('historyMenuBtn').addEventListener('click', () => {
      userMenu.classList.remove('header__user-menu--open');
      historyPanel.classList.add('history-panel--open');
      historyToggleBtn.classList.add('extras-btn--active');
      renderHistory();
    });

    historyToggleBtn.addEventListener('click', () => {
      if (!currentUser) { openAuthModal('login'); return; }
      historyPanel.classList.toggle('history-panel--open');
      historyToggleBtn.classList.toggle('extras-btn--active', historyPanel.classList.contains('history-panel--open'));
      if (historyPanel.classList.contains('history-panel--open')) renderHistory();
    });

    document.getElementById('settingsMenuBtn').addEventListener('click', () => {
      userMenu.classList.remove('header__user-menu--open');
      saveUserPreferences();
    });

    savePrefsBtn.addEventListener('click', saveUserPreferences);
    exportHistoryBtn.addEventListener('click', exportHistory);
    shareBtn.addEventListener('click', shareTranslation);
    document.getElementById('clearHistoryBtn').addEventListener('click', clearHistory);

    /* ===== Init ===== */
    initTheme();
    renderTabs();
    renderDropdownLists();
    updateCharCounter();
    updateAuthUI();
  </script>
</body>
</html>
